<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Cards</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --line: #e2e1dc; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --panel: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --line: #2e2d2b; --accent: #3987e5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--ink-2); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center; cursor: pointer; color: var(--ink-2); transition: border-color .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); color: var(--ink); }
  label { display: block; font-size: 12px; color: var(--ink-2); margin: 14px 0 4px; }
  input[type=text], select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; padding: 10px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  #status { margin-top: 12px; font-size: 13px; color: var(--ink-2); min-height: 1.4em; }
  .preview { display: flex; align-items: flex-start; justify-content: center; }
  canvas { width: 100%; max-width: 540px; height: auto; border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.18); }
  .empty { color: var(--ink-2); padding: 80px 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Health Cards</h1>
    <p class="sub">Drop a FatSecret food-diary CSV or an openScale export → get a shareable image. Everything stays in your browser.</p>
    <div class="panel">
      <div id="drop">Drop CSV here or click to choose<input id="file" type="file" accept=".csv,text/csv" hidden></div>

      <label for="daySel" id="dayLbl" hidden>Day / measurement</label>
      <select id="daySel" hidden></select>

      <label for="handle">Signature (e.g. @yourname)</label>
      <input id="handle" type="text" placeholder="@yourname">

      <label for="lang">Card language</label>
      <select id="lang"><option value="uk">Українська</option><option value="en">English</option></select>

      <label for="theme">Card theme</label>
      <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select>

      <label for="size">Size</label>
      <select id="size">
        <option value="1080x1350">Portrait 1080×1350 (feed)</option>
        <option value="1080x1920">Story 1080×1920</option>
      </select>

      <div class="row">
        <button id="dl" disabled>Download PNG</button>
        <button id="copy" class="ghost" disabled>Copy</button>
      </div>
      <div id="status"></div>
    </div>
  </section>
  <section class="preview">
    <div id="empty" class="empty">No file loaded yet.</div>
    <canvas id="cv" hidden></canvas>
  </section>
</main>

<script>
// ---------- i18n ----------
const T = {
  uk: {
    food: 'ЩОДЕННИК ХАРЧУВАННЯ', scale: 'ЗВАЖУВАННЯ', kcal: 'ккал', eaten: 'спожито за день',
    protein: 'Білки', fat: 'Жири', carbs: 'Вуглеводи', macroTitle: 'Частка калорій за макро',
    fiber: 'Клітковина', sugar: 'Цукор', sat: 'Насичені жири', sodium: 'Натрій', chol: 'Холестерин', potassium: 'Калій',
    meals: 'За прийомами їжі', g: 'г', mg: 'мг', kg: 'кг',
    weight: 'Вага', bmi: 'ІМТ', bodyFat: 'Жир', muscle: "М'язи", water: 'Вода', bone: 'Кістки', visceral: 'Вісцеральний жир',
    bmr: 'Базовий обмін', tdee: 'Добова витрата', lbm: 'Суха маса', proteinPct: 'Білок', bcm: 'Клітинна маса',
    composition: 'Склад тіла', since: 'від', fatMass: 'Жирова маса', leanMass: 'Суха маса', trend: 'Динаміка ваги',
    bmiCat: v => v < 18.5 ? 'недостатня вага' : v < 25 ? 'норма' : v < 30 ? 'надмірна вага' : 'ожиріння',
    meal: { 'Сніданок': 'Сніданок', 'Обід': 'Обід', 'Вечеря': 'Вечеря', 'Перекуси/Інше': 'Перекуси' },
    months: ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'],
    days: ['неділя','понеділок','вівторок','середа','четвер',"п'ятниця",'субота'],
  },
  en: {
    food: 'FOOD DIARY', scale: 'WEIGH-IN', kcal: 'kcal', eaten: 'eaten today',
    protein: 'Protein', fat: 'Fat', carbs: 'Carbs', macroTitle: 'Calorie split by macro',
    fiber: 'Fiber', sugar: 'Sugar', sat: 'Saturated fat', sodium: 'Sodium', chol: 'Cholesterol', potassium: 'Potassium',
    meals: 'By meal', g: 'g', mg: 'mg', kg: 'kg',
    weight: 'Weight', bmi: 'BMI', bodyFat: 'Body fat', muscle: 'Muscle', water: 'Water', bone: 'Bone', visceral: 'Visceral fat',
    bmr: 'BMR', tdee: 'TDEE', lbm: 'Lean mass', proteinPct: 'Protein', bcm: 'Body cell mass',
    composition: 'Body composition', since: 'since', fatMass: 'Fat mass', leanMass: 'Lean mass', trend: 'Weight trend',
    bmiCat: v => v < 18.5 ? 'underweight' : v < 25 ? 'normal' : v < 30 ? 'overweight' : 'obese',
    meal: { 'Сніданок': 'Breakfast', 'Обід': 'Lunch', 'Вечеря': 'Dinner', 'Перекуси/Інше': 'Snacks' },
    months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    days: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  },
};
const UK_MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const UK_MONTHS_NOM = ['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'];

// Card palettes — first three categorical slots of the reference palette (validated all-pairs, both modes)
const THEMES = {
  dark:  { bg: '#1a1a19', tile: '#242422', ink: '#ffffff', ink2: '#c3c2b7', ink3: '#8c8b84', grid: '#34332f',
           s1: '#3987e5', s2: '#d95926', s3: '#199e70' },
  light: { bg: '#fcfcfb', tile: '#f1f0ec', ink: '#0b0b0b', ink2: '#52514e', ink3: '#86857f', grid: '#dcdbd5',
           s1: '#2a78d6', s2: '#eb6834', s3: '#1baf7a' },
};

// ---------- file reading ----------
function decode(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); }
  catch { return new TextDecoder('windows-1251').decode(buf); }
}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

const num = s => {
  if (s == null) return null;
  s = String(s).trim().replace(/\s/g, '').replace(',', '.');
  if (s === '') return null;
  const v = parseFloat(s); return isFinite(v) ? v : null;
};

// FatSecret food diary: columns are positional (Date, Cal, Fat, Sat, Carb, Fiber, Sugar, Protein, Sodium, Chol, Potassium)
function parseFood(rows) {
  const hi = rows.findIndex(r => r.length > 5 && /^(дата|date)$/i.test(r[0].trim()));
  if (hi < 0) return null;
  const days = []; let day = null;
  for (const r of rows.slice(hi + 1)) {
    if (!r.length || r.every(c => c.trim() === '') || r[0].startsWith('#')) continue;
    const name = r[0];
    const vals = { cal: num(r[1]), fat: num(r[2]), sat: num(r[3]), carbs: num(r[4]), fiber: num(r[5]),
                   sugar: num(r[6]), protein: num(r[7]), sodium: num(r[8]), chol: num(r[9]), potassium: num(r[10]) };
    if (/^\s/.test(name)) { if (day) day.meals.push({ name: name.trim(), ...vals }); }
    else if (/^(всього|total)/i.test(name.trim())) continue;
    else { day = { label: name.trim(), date: parseFoodDate(name.trim()), ...vals, meals: [] }; days.push(day); }
  }
  return days.length ? { kind: 'food', items: days } : null;
}

function parseFoodDate(s) {
  // "вівторок, вересня 22, 2026" or "Tuesday, September 22, 2026"
  const m = s.match(/,\s*([^\d,]+?)\s+(\d{1,2}),\s*(\d{4})/);
  if (!m) return null;
  const name = m[1].toLowerCase();
  let mi = UK_MONTHS_GEN.indexOf(name);
  if (mi < 0) mi = UK_MONTHS_NOM.indexOf(name);
  if (mi < 0) mi = T.en.months.findIndex(x => x.toLowerCase().startsWith(name.slice(0, 3)));
  return mi < 0 ? null : new Date(+m[3], mi, +m[2]);
}

function parseScale(rows) {
  const h = rows[0].map(x => x.trim().toUpperCase());
  if (h[0] !== 'DATE' || !h.includes('WEIGHT')) return null;
  const items = rows.slice(1).filter(r => r.length > 2 && r[0].trim()).map(r => {
    const o = {}; h.forEach((k, i) => o[k] = k === 'DATE' || k === 'TIME' || k === 'COMMENT' ? (r[i] || '').trim() : num(r[i]));
    const [y, mo, d] = o.DATE.split('-').map(Number);
    const [hh = 0, mm = 0] = (o.TIME || '').split(':').map(Number);
    o.date = new Date(y, mo - 1, d, hh, mm);
    o.label = `${o.DATE} ${(o.TIME || '').slice(0, 5)}`;
    return o;
  }).filter(o => o.WEIGHT != null).sort((a, b) => a.date - b.date);
  return items.length ? { kind: 'scale', items } : null;
}

// ---------- drawing helpers ----------
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const f = (n, w = 400) => `${w} ${n}px ${FONT}`;
// same style in every language: space between thousands, dot for decimals (4 863, 17.1)
const fmt = (v, d = 0) => {
  if (v == null) return '—';
  const [int, frac] = Math.abs(v).toFixed(d).split('.');
  const s = int.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + (frac ? '.' + frac : '');
  return v < 0 ? '−' + s : s;
};

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function text(ctx, s, x, y, font, color, align = 'left', base = 'alphabetic') {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}

function fmtDate(d, withDay = true, time = false) {
  const t = T[state.lang];
  if (!d) return '';
  let s = state.lang === 'uk' ? `${d.getDate()} ${t.months[d.getMonth()]} ${d.getFullYear()}` : `${t.months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  if (withDay) s = `${t.days[d.getDay()]}, ${s}`;
  if (time) s += ` · ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  return s;
}

function header(ctx, W, P, th, title, sub) {
  text(ctx, title, P, P + 30, f(26, 700), th.ink2);
  if (state.handle) text(ctx, state.handle, W - P, P + 30, f(26, 600), th.ink2, 'right');
  text(ctx, sub, P, P + 82, f(40, 600), th.ink);
}

function tiles(ctx, x, y, w, items, th, cols = 3, h = 150) {
  const gap = 16, tw = (w - gap * (cols - 1)) / cols;
  items.forEach((it, i) => {
    const cx = x + (i % cols) * (tw + gap), cy = y + Math.floor(i / cols) * (h + gap);
    ctx.fillStyle = th.tile; rr(ctx, cx, cy, tw, h, 18); ctx.fill();
    text(ctx, it.label, cx + 24, cy + h * 0.31, f(24, 500), th.ink2);
    const vw = text(ctx, it.value, cx + 24, cy + h * 0.78, f(h < 130 ? 44 : 50, 700), th.ink);
    if (it.unit) text(ctx, it.unit, cx + 24 + vw + 8, cy + h * 0.78, f(26, 500), th.ink3);
  });
  return Math.ceil(items.length / cols) * (h + gap) - gap;
}

// ---------- food card ----------
function drawFood(ctx, W, H, th, d) {
  const t = T[state.lang], P = 72, CW = W - 2 * P;
  header(ctx, W, P, th, t.food, fmtDate(d.date) || d.label);

  // compact layout when many meals must fit on the shorter feed card
  const tight = d.meals.filter(m => m.cal).length > 3 && H < 1500;

  // hero number
  let y = P + (tight ? 210 : 240);
  const w = text(ctx, fmt(d.cal), P, y, f(tight ? 120 : 150, 800), th.ink);
  text(ctx, t.kcal, P + w + 16, y, f(44, 600), th.ink2);
  text(ctx, t.eaten, P, y + 50, f(26, 400), th.ink3);

  // macro split: calories from each macro
  y += tight ? 100 : 120;
  text(ctx, t.macroTitle, P, y, f(26, 600), th.ink2);
  y += 26;
  const macros = [
    { k: 'protein', g: d.protein || 0, kc: (d.protein || 0) * 4, c: th.s1 },
    { k: 'fat',     g: d.fat || 0,     kc: (d.fat || 0) * 9,     c: th.s2 },
    { k: 'carbs',   g: d.carbs || 0,   kc: (d.carbs || 0) * 4,   c: th.s3 },
  ];
  const tot = macros.reduce((s, m) => s + m.kc, 0) || 1;
  const barH = 44; let bx = P;
  macros.forEach((m, i) => {
    const bw = CW * m.kc / tot - (i < 2 ? 4 : 0);
    if (bw > 0) { ctx.fillStyle = m.c; rr(ctx, bx, y, bw, barH, 8); ctx.fill(); }
    bx += bw + 4;
  });
  y += barH + 24;
  const colW = CW / 3;
  macros.forEach((m, i) => {
    const cx = P + i * colW;
    ctx.fillStyle = m.c; rr(ctx, cx, y, 18, 18, 4); ctx.fill();
    text(ctx, t[m.k], cx + 28, y + 17, f(26, 600), th.ink2);
    const vw = text(ctx, fmt(m.g), cx, y + 80, f(56, 700), th.ink);
    text(ctx, t.g, cx + vw + 6, y + 80, f(28, 500), th.ink3);
    text(ctx, `${Math.round(m.kc / tot * 100)}% ${t.kcal}`, cx, y + 118, f(24, 500), th.ink3);
  });

  // micro tiles
  y += tight ? 146 : 158;
  y += tiles(ctx, P, y, CW, [
    { label: t.fiber, value: fmt(d.fiber, d.fiber % 1 ? 1 : 0), unit: t.g },
    { label: t.sugar, value: fmt(d.sugar), unit: t.g },
    { label: t.sat, value: fmt(d.sat), unit: t.g },
    { label: t.sodium, value: fmt(d.sodium), unit: t.mg },
    { label: t.chol, value: fmt(d.chol), unit: t.mg },
    { label: t.potassium, value: fmt(d.potassium), unit: t.mg },
  ], th, 3, tight ? 100 : 120);

  // meals: calories + macro split per meal
  const meals = d.meals.filter(m => m.cal);
  if (meals.length) {
    y += tight ? 52 : 60;
    text(ctx, t.meals, P, y, f(26, 600), th.ink2);
    y += tight ? 12 : 20;
    const max = Math.max(...meals.map(m => m.cal));
    const rh = Math.min(104, (H - P - 20 - y) / meals.length);
    const g = v => fmt(v || 0, v && v < 10 ? 1 : 0);
    meals.forEach((m, i) => {
      const cy = y + i * rh, ty = cy + rh * 0.42;
      text(ctx, t.meal[m.name] || m.name, P, ty, f(28, 600), th.ink);
      text(ctx, `${fmt(m.cal)} ${t.kcal}`, W - P, ty, f(28, 700), th.ink, 'right');
      // grams per macro, colour key matches the macro legend above
      let gx = P + 230;
      [[m.protein, th.s1], [m.fat, th.s2], [m.carbs, th.s3]].forEach(([v, c]) => {
        ctx.fillStyle = c; rr(ctx, gx, ty - 17, 16, 16, 4); ctx.fill();
        gx += 24 + text(ctx, `${g(v)} ${t.g}`, gx + 24, ty, f(24, 500), th.ink2) + 28;
      });
      // stacked bar: length = meal kcal vs biggest meal, segments = macro kcal share
      const by = ty + 16, bh = 16, full = Math.max(8, CW * m.cal / max);
      const parts = [[(m.protein || 0) * 4, th.s1], [(m.fat || 0) * 9, th.s2], [(m.carbs || 0) * 4, th.s3]];
      const sum = parts.reduce((a, [v]) => a + v, 0);
      ctx.fillStyle = th.grid; rr(ctx, P, by + 5, CW, 6, 3); ctx.fill();
      if (!sum) { ctx.fillStyle = th.ink3; rr(ctx, P, by, full, bh, 4); ctx.fill(); return; }
      let bx = P;
      const segs = parts.filter(([v]) => v > 0);
      segs.forEach(([v, c], j) => {
        const w = full * v / sum - (j < segs.length - 1 ? 2 : 0);
        if (w > 0.5) { ctx.fillStyle = c; rr(ctx, bx, by, w, bh, 4); ctx.fill(); }
        bx += w + 2;
      });
    });
  }
}

// ---------- scale card ----------
function drawScale(ctx, W, H, th, all, idx) {
  const t = T[state.lang], P = 72, CW = W - 2 * P, m = all[idx];
  header(ctx, W, P, th, t.scale, fmtDate(m.date, true, !!m.TIME));

  let y = P + 240;
  const w = text(ctx, fmt(m.WEIGHT, 1), P, y, f(150, 800), th.ink);
  text(ctx, t.kg, P + w + 16, y, f(44, 600), th.ink2);
  if (m.BMI != null) text(ctx, `${t.bmi} ${fmt(m.BMI, 1)} · ${t.bmiCat(m.BMI)}`, P, y + 50, f(26, 400), th.ink3);

  // change vs previous measurement
  if (idx > 0) {
    const diff = m.WEIGHT - all[idx - 1].WEIGHT;
    const s = `${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${fmt(Math.abs(diff), 1)} ${t.kg}`;
    text(ctx, s, W - P, y, f(44, 700), th.ink2, 'right');
    text(ctx, `${t.since} ${fmtDate(all[idx - 1].date, false)}`, W - P, y + 50, f(26, 400), th.ink3, 'right');
  }

  // composition bar: fat mass vs lean mass
  y += 120;
  if (m.BODY_FAT != null) {
    const fatKg = m.WEIGHT * m.BODY_FAT / 100, leanKg = m.WEIGHT - fatKg;
    text(ctx, t.composition, P, y, f(26, 600), th.ink2);
    y += 26;
    const fw = CW * fatKg / m.WEIGHT;
    ctx.fillStyle = th.s2; rr(ctx, P, y, fw - 2, 44, 8); ctx.fill();
    ctx.fillStyle = th.s1; rr(ctx, P + fw + 2, y, CW - fw - 2, 44, 8); ctx.fill();
    y += 68;
    [[t.fatMass, fatKg, m.BODY_FAT, th.s2], [t.leanMass, leanKg, 100 - m.BODY_FAT, th.s1]].forEach(([lab, kg, pct, c], i) => {
      const cx = P + i * CW / 2;
      ctx.fillStyle = c; rr(ctx, cx, y, 18, 18, 4); ctx.fill();
      text(ctx, lab, cx + 28, y + 17, f(26, 600), th.ink2);
      const vw = text(ctx, fmt(kg, 1), cx, y + 80, f(56, 700), th.ink);
      text(ctx, `${t.kg} · ${fmt(pct, 1)}%`, cx + vw + 8, y + 80, f(28, 500), th.ink3);
    });
    y += 150;
  }

  const defs = [
    ['BODY_FAT', t.bodyFat, '%', 1], ['MUSCLE', t.muscle, '%', 1], ['WATER', t.water, '%', 1],
    ['BONE', t.bone, t.kg, 1], ['VISCERAL_FAT', t.visceral, '', 1], ['PROTEIN', t.proteinPct, '%', 1],
    ['BMR', t.bmr, t.kcal, 0], ['TDEE', t.tdee, t.kcal, 0], ['BCM', t.bcm, t.kg, 1],
  ];
  const items = defs.filter(([k]) => m[k] != null).map(([k, label, unit, dp]) => ({ label, value: fmt(m[k], dp), unit }));
  y += tiles(ctx, P, y, CW, items, th, 3, 140);

  // trend sparkline when the export holds several measurements
  const pts = all.slice(0, idx + 1).slice(-30);
  if (pts.length > 1 && H - P - y > 220) {
    y += 64;
    text(ctx, t.trend, P, y, f(26, 600), th.ink2);
    y += 50;
    const ch = Math.min(240, H - P - 60 - y);
    const ws = pts.map(p => p.WEIGHT), lo = Math.min(...ws), hi = Math.max(...ws), span = hi - lo || 1;
    const X = i => P + CW * i / (pts.length - 1), Y = v => y + ch - (v - lo) / span * ch;
    ctx.strokeStyle = th.grid; ctx.lineWidth = 2;
    [y, y + ch].forEach(gy => { ctx.beginPath(); ctx.moveTo(P, gy); ctx.lineTo(W - P, gy); ctx.stroke(); });
    ctx.strokeStyle = th.s1; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.WEIGHT)) : ctx.moveTo(X(i), Y(p.WEIGHT))); ctx.stroke();
    const lx = X(pts.length - 1), ly = Y(ws.at(-1));
    ctx.fillStyle = th.bg; ctx.beginPath(); ctx.arc(lx, ly, 11, 0, 7); ctx.fill();
    ctx.fillStyle = th.s1; ctx.beginPath(); ctx.arc(lx, ly, 8, 0, 7); ctx.fill();
    text(ctx, `${fmt(hi, 1)} ${t.kg}`, W - P, y - 10, f(22, 500), th.ink3, 'right');
    text(ctx, `${fmt(lo, 1)} ${t.kg}`, W - P, y + ch + 32, f(22, 500), th.ink3, 'right');
    text(ctx, fmtDate(pts[0].date, false), P, y + ch + 32, f(22, 500), th.ink3);
  }
}

// ---------- app ----------
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const state = { data: null, idx: 0, lang: 'uk', theme: 'dark', handle: '', size: '1080x1350', name: 'card' };

function render() {
  if (!state.data) return;
  const [W, H] = state.size.split('x').map(Number);
  cv.width = W; cv.height = H;
  const th = THEMES[state.theme];
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
  if (state.data.kind === 'food') drawFood(ctx, W, H, th, state.data.items[state.idx]);
  else drawScale(ctx, W, H, th, state.data.items, state.idx);
  cv.hidden = false; $('empty').hidden = true;
  $('dl').disabled = $('copy').disabled = false;
}

async function load(file) {
  try {
    const rows = parseCSV(decode(await file.arrayBuffer()));
    const data = parseScale(rows) || parseFood(rows);
    if (!data) { $('status').textContent = 'Unrecognised CSV — expected a FatSecret food diary or openScale export.'; return; }
    state.data = data;
    state.idx = data.kind === 'scale' ? data.items.length - 1 : 0;
    state.name = data.kind === 'food' ? 'food' : 'weigh-in';
    const sel = $('daySel');
    sel.innerHTML = data.items.map((it, i) => `<option value="${i}">${it.label}</option>`).join('');
    sel.value = state.idx;
    sel.hidden = $('dayLbl').hidden = data.items.length < 2;
    $('status').textContent = `Loaded ${data.kind === 'food' ? 'food diary' : 'openScale'} · ${data.items.length} ${data.items.length === 1 ? 'entry' : 'entries'}`;
    render();
  } catch (e) { $('status').textContent = 'Could not read file: ' + e.message; }
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });

const bind = (id, key, cast = v => v) => $(id).addEventListener('input', e => { state[key] = cast(e.target.value); save(); render(); });
bind('handle', 'handle'); bind('lang', 'lang'); bind('theme', 'theme'); bind('size', 'size'); bind('daySel', 'idx', Number);

function save() { try { localStorage.setItem('healthcards', JSON.stringify({ lang: state.lang, theme: state.theme, handle: state.handle, size: state.size })); } catch {} }
try {
  const s = JSON.parse(localStorage.getItem('healthcards') || '{}');
  for (const k of ['lang', 'theme', 'handle', 'size']) if (s[k] != null) { state[k] = s[k]; $(k).value = s[k]; }
} catch {}

function fileName() {
  const it = state.data.items[state.idx], d = it.date;
  const ds = d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : 'card';
  return `${state.name}-${ds}.png`;
}
$('dl').onclick = () => cv.toBlob(b => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fileName(); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('copy').onclick = () => cv.toBlob(async b => {
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); $('status').textContent = 'Image copied to clipboard.'; }
  catch { $('status').textContent = 'Clipboard not available here — use Download.'; }
});
</script>
</body>
